# Local/dev orchestration for the 8 backend components (ARCHITECTURE_REVIEW_GAPS.md, G1 + G3).
# This is NOT the production deployment target — that's container orchestration across two
# availability zones with managed MySQL (DigiLend_Production_Architecture.docx §8). This compose
# file exists so the services can be built, run, and integration-tested together without eight
# manual `mvnd spring-boot:run` windows, and so each service's Dockerfile is exercised at least
# once before it reaches a real orchestrator.
#
# Usage:
#   cp .env.example .env      # then edit .env with real values
#   docker compose up --build
#
# NOT build/run-verified against a real Docker engine — this development machine has neither
# Docker nor WSL installed. Written correctly against each service's actual config (ports,
# artifact names, inter-service URL env vars all confirmed directly against pom.xml/application.yml
# — see ARCHITECTURE_REVIEW_GAPS.md, G1/G3), but treat the first `docker compose up --build` as the
# real verification step, not this comment. The Eureka registration + lb:// gateway routing
# mechanics themselves ARE runtime-verified — just not inside these exact containers, since no
# Docker engine is available here (see G3's note in the gap tracker for the real end-to-end test
# that was run instead, against plain jars on this host).

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set this in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ARCHITECTURE_REVIEW_GAPS.md, G3 — Eureka service registry. Every other service below registers
  # with it on startup; api-gateway resolves its routes (lb://<service>) against it instead of a
  # hardcoded host:port.
  service-registry:
    build: ./service-registry
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set this in .env}
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
    volumes:
      - auth-branding:/app/branding-store
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  affordability-service:
    build: ./affordability-service
    ports:
      - "8083:8083"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set this in .env}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  product-service:
    build: ./product-service
    ports:
      - "8084:8084"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set this in .env}
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  document-service:
    build: ./document-service
    ports:
      - "8085:8085"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set this in .env}
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
    volumes:
      - document-store:/app/document-store
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification-service:
    build: ./notification-service
    ports:
      - "8086:8086"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set this in .env}
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      # Its own outbound call to auth-service for branding stays on this static URL from G1 —
      # deliberately not converted to Eureka/lb:// (see G3 in ARCHITECTURE_REVIEW_GAPS.md).
      AUTH_SERVICE_URL: http://auth-service:8081
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  application-service:
    build: ./application-service
    ports:
      - "8082:8082"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set this in .env}
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      # Its own outbound calls to these 4 services stay on static URLs from G1 — deliberately not
      # converted to Eureka/lb:// (see G3 in ARCHITECTURE_REVIEW_GAPS.md).
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      DOCUMENT_SERVICE_URL: http://document-service:8085
      AFFORDABILITY_SERVICE_URL: http://affordability-service:8083
      PRODUCT_SERVICE_URL: http://product-service:8084
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      document-service:
        condition: service_healthy
      affordability-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ARCHITECTURE_REVIEW_GAPS.md, G3 — no more per-route *_SERVICE_URL env vars here. Every route in
  # api-gateway's application.yml is now lb://<service>, resolved dynamically against
  # service-registry. This is the one component whose routing genuinely requires the registry to
  # be reachable and the target service to have registered — every other service above keeps
  # working fine even if service-registry is briefly unavailable (they only register themselves).
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
    depends_on:
      service-registry:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
      affordability-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      document-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql-data:
  auth-branding:
  document-store:
