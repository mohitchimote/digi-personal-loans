server:
  port: 8085

# EUREKA_SERVER_URL defaults to localhost for `mvnd spring-boot:run` — Docker Compose overrides it
# to the `service-registry` container (see backend/docker-compose.yml), so nothing here changes
# for local dev.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

spring:
  application:
    name: document-service
  datasource:
    # DB_HOST defaults to localhost for `mvnd spring-boot:run` — Docker Compose overrides it to the
    # `mysql` service name (see backend/docker-compose.yml), so nothing here changes for local dev.
    url: jdbc:mysql://${DB_HOST:localhost}:3306/digibank_docs?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    # No default — required. Missing env var fails startup immediately rather than falling back to
    # a guessable value. Set locally via your shell/IDE run config, never in this file.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    # No default — required. Must match every other service's app.jwt.secret (and auth-service's,
    # which issues the token) — see PRODUCTION_READINESS.md §4/§5.
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info

document:
  storage:
    path: ./document-store

logging:
  pattern:
    # Injects CorrelationIdFilter's MDC value next to the log level (S4, ARCHITECTURE_REVIEW_GAPS.md)
    # — e.g. "INFO [a1b2c3d4-...]" — so a request's log lines across every service it touches can be
    # grepped out by one ID. ":-" default keeps startup/background logs (no request in flight) clean.
    level: "%5p [%X{correlationId:-}]"
