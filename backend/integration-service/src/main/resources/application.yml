server:
  port: 8088

# EUREKA_SERVER_URL defaults to localhost for `mvnd spring-boot:run` — Docker Compose overrides it
# to the `service-registry` container (see backend/docker-compose.yml), so nothing here changes
# for local dev.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

spring:
  application:
    name: integration-service

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.digibank: INFO
  # Console output is now structured JSON (logback.xml, S4 remainder, ARCHITECTURE_REVIEW_GAPS.md)
  # — CorrelationIdFilter's MDC value lands there as a top-level `correlationId` field
  # automatically; the old plain-text pattern override this replaced is gone.
