server:
  port: 8086

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://localhost:3306/digibank_notifications?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    # No default — required. Missing env var fails startup immediately rather than falling back to
    # a guessable value. Set locally via your shell/IDE run config, never in this file.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

app:
  jwt:
    # No default — required. Must match every other service's app.jwt.secret (and auth-service's,
    # which issues the token) — see PRODUCTION_READINESS.md §4/§5.
    secret: ${JWT_SECRET}
