server:
  port: 8086

spring:
  application:
    name: notification-service
  datasource:
    # DB_HOST defaults to localhost for `mvnd spring-boot:run` — Docker Compose overrides it to the
    # `mysql` service name (see backend/docker-compose.yml), so nothing here changes for local dev.
    url: jdbc:mysql://${DB_HOST:localhost}:3306/digibank_notifications?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    # No default — required. Missing env var fails startup immediately rather than falling back to
    # a guessable value. Set locally via your shell/IDE run config, never in this file.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

app:
  jwt:
    # No default — required. Must match every other service's app.jwt.secret (and auth-service's,
    # which issues the token) — see PRODUCTION_READINESS.md §4/§5.
    secret: ${JWT_SECRET}
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  resend:
    # Both optional (no default value needed, just absent/blank if unset) — ResendClient reports a
    # clear "not configured" error rather than attempting the call when the key is missing, same as
    # worker/src/lib/email.ts's deliverEmail. Set via env var, never checked into this file.
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
