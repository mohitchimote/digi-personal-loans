server:
  port: 8082
  error:
    # "always" leaks exception messages/validation internals to any caller — real risk once this
    # sits behind auth rather than being open to begin with (PRODUCTION_READINESS.md §5, finding 5).
    # Override via env var only for local debugging, never in a deployed environment.
    include-message: ${ERROR_INCLUDE_MESSAGE:never}
    include-binding-errors: ${ERROR_INCLUDE_BINDING_ERRORS:never}

spring:
  application:
    name: application-service
  datasource:
    url: jdbc:mysql://localhost:3306/digibank_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    # No default — required. Missing env var fails startup immediately rather than falling back to
    # a guessable value. Set locally via your shell/IDE run config, never in this file.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

app:
  jwt:
    # No default — required. Must match every other service's app.jwt.secret (and auth-service's,
    # which issues the token) — see PRODUCTION_READINESS.md §4/§5.
    secret: ${JWT_SECRET}
  notification-service:
    url: http://localhost:8086
  document-service:
    url: http://localhost:8085
  affordability-service:
    url: http://localhost:8083
  product-service:
    url: http://localhost:8084

logging:
  level:
    com.digibank: INFO
