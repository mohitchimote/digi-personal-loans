server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # Dev-only origins (localhost, a dev LAN IP) belong here for local `mvnd spring-boot:run`
            # convenience. A production deploy should replace this whole list with only real
            # customer domain(s), sourced from environment-specific config rather than this
            # checked-in file — see PRODUCTION_READINESS.md §3/§4. An ephemeral ngrok tunnel URL
            # used to be listed here too; removed — free-tier ngrok subdomains are reassignable, so
            # leaving one in a shared config with allowCredentials:true is a standing credential-
            # leak risk once that subdomain is claimed by someone else (PRODUCTION_READINESS.md §5,
            # finding 6).
            allowedOrigins:
              - "http://localhost:4200"
              - "http://10.73.91.21:4200"
              - "https://ispersonalloans.tcsdigilend.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Headers Access-Control-Allow-Methods Access-Control-Allow-Origin Access-Control-Expose-Headers Access-Control-Max-Age Vary, RETAIN_UNIQUE
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: branding
          uri: http://localhost:8081
          predicates:
            - Path=/api/branding/**

        - id: application-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/applications/**

        - id: affordability-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/affordability/**

        - id: product-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/products/**

        - id: document-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/documents/**

        - id: notification-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: INFO
