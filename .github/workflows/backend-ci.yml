name: Backend CI

# ARCHITECTURE_REVIEW_GAPS.md, G2 — the repo had no CI/CD pipeline of any kind before this. Scope
# here is deliberately CI (build, test, containerize, publish an image), not CD: there is no
# decided deployment target yet (no container orchestration platform chosen, no environments
# defined — doc Open Point 11), so this stops at "an image exists in the registry, ready to be
# deployed to wherever that ends up being," not at deploying it anywhere.

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-test-and-publish:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - service-registry
          - api-gateway
          - auth-service
          - application-service
          - affordability-service
          - product-service
          - document-service
          - notification-service
          - rule-service
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml

      # Fast, native feedback ahead of the containerized build below (which repeats this build
      # inside the Dockerfile's own build stage — some duplication, but it keeps this step's logs
      # readable and fails fast before spending time on an image build that's doomed anyway).
      # No test suite exists in this service yet (ARCHITECTURE_REVIEW_GAPS.md) — `verify` still
      # exercises compile + package + Surefire's "no tests found" pass-through, and becomes a real
      # test gate the moment tests land, with no workflow change needed.
      - name: Build and verify (mvn)
        run: mvn -B verify

      # Image publish only on an actual push to master — a pull request (including from a fork,
      # which gets a read-only token) only needs the build/verify step above to gate the merge.
      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: backend/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
