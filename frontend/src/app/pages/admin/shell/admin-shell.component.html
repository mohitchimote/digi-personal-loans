<div class="uw-shell">
  <header class="uw-header">
    <button class="rail-toggle" type="button" (click)="toggleRail()"
            [attr.aria-label]="(collapsed() ? 'admin.nav.expand' : 'admin.nav.collapse') | translate"
            [attr.aria-expanded]="!collapsed()">
      <span class="material-icons">{{ collapsed() ? 'menu' : 'menu_open' }}</span>
    </button>
    <a class="uw-brand" routerLink="/admin/home">
      <app-brand-logo iconClass="mi-lg" />
      <span>{{ 'admin.brand' | translate }}</span>
    </a>
    <div class="uw-spacer"></div>
    <div class="uw-header-right">
      <app-language-switcher />
      <div class="header-user">
        <span class="user-avatar-sm">{{ (auth.userFullName || 'U')[0] }}</span>
        <span class="header-name">{{ auth.userFullName }}</span>
      </div>
      <button class="db-btn db-btn--ghost db-btn--sm" (click)="auth.logout()">{{ 'common.signOut' | translate }}</button>
    </div>
  </header>

  <div class="uw-body">
    <nav class="rail" [class.collapsed]="collapsed()" [attr.aria-label]="'admin.brand' | translate">
      <a class="rail-item rail-home" routerLink="/admin/home" routerLinkActive="active"
         [attr.title]="collapsed() ? ('admin.nav.home' | translate) : null">
        <span class="material-icons">dashboard</span>
        <span class="rail-label">{{ 'admin.nav.home' | translate }}</span>
      </a>
      <div class="rail-group" *ngFor="let group of nav">
        <div class="rail-group-title">{{ group.labelKey | translate }}</div>
        <a class="rail-item" *ngFor="let item of group.items"
           [routerLink]="item.route" routerLinkActive="active"
           [attr.title]="collapsed() ? (item.labelKey | translate) : null">
          <span class="material-icons">{{ item.icon }}</span>
          <span class="rail-label">{{ item.labelKey | translate }}</span>
        </a>
      </div>
    </nav>

    <main class="uw-content">
      <router-outlet />
    </main>
  </div>
</div>
