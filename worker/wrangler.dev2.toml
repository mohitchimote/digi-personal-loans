# Second deployment of the dev branch, for checking changes without running locally:
# https://digibank-personal-loans2.mohit-chimote.workers.dev. Own database and bucket, no custom
# domain, so it can never touch the main deployment's data. Deploy with:
#   npm run deploy:dev2   (builds the frontend, applies migrations, deploys)
# Secrets (JWT_SECRET, RESEND_API_KEY) are set per worker with `wrangler secret put -c wrangler.dev2.toml`.

name = "digibank-personal-loans2"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[assets]
directory = "../frontend/dist/frontend/browser"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "digibank2"
database_id = "a351010d-ef9e-410d-aa87-8fb39464bfe5"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "digibank-documents2"

[vars]
DEMO_MODE = "true"
# The "from" address for event notification emails (sent via Resend, see lib/email.ts). Must be
# on a domain verified in your Resend account, or delivery will fail.
RESEND_FROM_EMAIL = "DigiLend <notifications@tcsdigilend.com>"

# Secrets (set via `wrangler secret put`, not stored here):
#   JWT_SECRET
#   RESEND_API_KEY — API key from resend.com, used by lib/email.ts to send event notification
#   emails. Until a sending domain is verified in Resend, delivery only reaches the Resend
#   account owner's own address — use the admin "Send test email" button until then.
