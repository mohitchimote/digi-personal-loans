name = "digibank-personal-loans"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../frontend/dist/frontend/browser"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "digibank"
database_id = "7e8a728a-f15b-4b38-9c3d-5cb64c031e46"

# R2 requires a one-time manual enable in the Cloudflare dashboard before the
# API can create buckets (error code 10042). Re-enable this block once that's
# done and `wrangler r2 bucket create digibank-documents` succeeds — not
# needed until Day 4 (document storage).
# [[r2_buckets]]
# binding = "DOCUMENTS"
# bucket_name = "digibank-documents"

[vars]
DEMO_MODE = "true"

# Secrets (set via `wrangler secret put`, not stored here):
#   JWT_SECRET
